version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cognilab_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cognilab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognilab_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/cognilab
      JWT_SECRET: super-secret-key-cognilab-dev-change-in-prod-89241f9b
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cognilab_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
